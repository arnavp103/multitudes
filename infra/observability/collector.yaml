# Receipt-check template. `pnpm dev:up` exports to Grafana LGTM's own collector
# instead; for Grafana Cloud or self-hosted Grafana, replace `debug` with an
# authenticated otlphttp exporter (docs/agent-platform.md#deployed-telemetry-grafana).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  batch: {}
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
