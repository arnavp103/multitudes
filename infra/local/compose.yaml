services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: multitudes
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?required}
      POSTGRES_DB: ${LOCAL_DB_NAME:?required}
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:?required}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multitudes -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 5s
      retries: 30
volumes:
  postgres:
